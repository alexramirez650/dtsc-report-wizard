<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; }
      h3 { margin: 6px 0 10px 0; }
      .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
      .col { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
      .hidden { display: none; }
      .panel {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }
      button { padding: 8px 10px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      label { font-size: 12px; color: #374151; font-weight: 600; }
      input, textarea, select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-family: Arial, sans-serif;
      }
      textarea { min-height: 72px; resize: vertical; }
      .meta { font-size: 12px; color: #374151; margin: 8px 0; }
      .hint { font-size: 11px; color: #6b7280; margin-top: -4px; }
      .bar-wrap {
        width: 100%;
        height: 12px;
        background: #e5e7eb;
        border-radius: 6px;
        overflow: hidden;
        margin: 8px 0 12px 0;
      }
      .bar {
        height: 100%;
        width: 0%;
        background: #2563eb;
        transition: width .2s linear;
      }
      .log {
        height: 300px;
        overflow: auto;
        background: #111827;
        color: #e5e7eb;
        font-family: Consolas, monospace;
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      .months-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .month-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .month-item input { width: auto; }
    </style>
  </head>
  <body>
    <h3>DTSC Report Wizard</h3>

    <div class="col">
      <label for="workflow">Action</label>
      <select id="workflow" onchange="onWorkflowChange()">
        <option value="wizard">Run Wizard</option>
        <option value="compile">Compile Month Totals</option>
      </select>

      <label for="customerNumber">Customer Number</label>
      <input id="customerNumber" placeholder="#199-1" />

      <label for="mode">Run Mode</label>
      <select id="mode">
        <option value="test">TEST</option>
        <option value="live">LIVE</option>
      </select>
    </div>

    <div id="wizardPanel" class="panel">
      <div class="col">
        <label for="invoiceNumbers">Invoice Number(s)</label>
        <textarea id="invoiceNumbers" placeholder="#199-1-01-08-26&#10;#199-1-01-15-26"></textarea>
        <div class="hint">Use comma or new line for multiple invoices.</div>

        <label for="invoiceLinks">Invoice Link(s) (optional)</label>
        <textarea id="invoiceLinks" placeholder="https://docs.google.com/spreadsheets/d/...&#10;or paste file IDs"></textarea>
        <div class="hint">If folder search misses an invoice, paste its Google Sheet link or file ID here.</div>

        <div class="row">
          <label for="hasSb20" style="font-weight:normal;display:flex;gap:6px;align-items:center;">
            <input id="hasSb20" type="checkbox" style="width:auto;" />
            Customer has SB-20 items
          </label>
        </div>
      </div>
    </div>

    <div id="compilePanel" class="panel hidden">
      <div class="col">
        <label for="compileType">Report Type</label>
        <select id="compileType" onchange="clearCompileTargets()">
          <option value="DTSC-ALL">DTSC-ALL</option>
          <option value="DTSC">DTSC</option>
          <option value="NETCOST">NETCOST</option>
        </select>

        <label for="compileYear">Report Year</label>
        <input id="compileYear" type="number" min="2000" max="2099" />

        <div class="row">
          <button id="btnLoadTargets" onclick="loadCompileTargets()">Load Report Files</button>
        </div>

        <label for="targetReportId">Target Report File</label>
        <select id="targetReportId"></select>
        <div class="hint">Choose the report file where month totals should be written.</div>

        <label>Months To Compile</label>
        <div id="monthsGrid" class="months-grid"></div>
      </div>
    </div>

    <div class="row">
      <button id="btnStart" onclick="startRun()">Start Run</button>
      <button id="btnStop" onclick="stopPolling()" disabled>Stop Poll</button>
    </div>

    <div class="meta" id="meta">Idle</div>
    <div class="meta" id="heartbeat">Last update: -</div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="log" id="log"></div>

    <script>
      const INITIAL_MODE = '<?= initialMode ?>' || 'wizard';
      const MONTH_NAMES = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      let runId = null;
      let pollHandle = null;
      let isRunning = false;
      let lastLogAt = null;

      function initMonthsGrid() {
        const grid = document.getElementById('monthsGrid');
        grid.innerHTML = '';
        MONTH_NAMES.forEach((name, idx) => {
          const month = idx + 1;
          const row = document.createElement('label');
          row.className = 'month-item';
          row.innerHTML = `<input type="checkbox" value="${month}" class="compile-month" /> ${name}`;
          grid.appendChild(row);
        });
      }

      function onWorkflowChange() {
        const mode = document.getElementById('workflow').value;
        const wizardPanel = document.getElementById('wizardPanel');
        const compilePanel = document.getElementById('compilePanel');
        const btnStart = document.getElementById('btnStart');

        if (mode === 'compile') {
          wizardPanel.classList.add('hidden');
          compilePanel.classList.remove('hidden');
          btnStart.textContent = 'Start Compile';
        } else {
          compilePanel.classList.add('hidden');
          wizardPanel.classList.remove('hidden');
          btnStart.textContent = 'Start Run';
        }
      }

      function clearCompileTargets() {
        const select = document.getElementById('targetReportId');
        select.innerHTML = '';
      }

      function getSharedInputs() {
        const customerNumber = document.getElementById('customerNumber').value.trim();
        const mode = document.getElementById('mode').value;
        const testMode = mode !== 'live';
        if (!customerNumber) throw new Error('Customer Number is required.');
        return { customerNumber, testMode };
      }

      function setUiRunning(running) {
        isRunning = running;
        document.getElementById('btnStart').disabled = running;
        document.getElementById('btnStop').disabled = !running;
        document.getElementById('btnLoadTargets').disabled = running;
      }

      function setLog(lines) {
        const el = document.getElementById('log');
        el.textContent = (lines || []).join('\n');
        el.scrollTop = el.scrollHeight;
      }

      function updateView(state) {
        const mode = state.mode || '-';
        const status = state.status || '-';
        const progress = Number(state.progress || 0);
        const logs = state.logs || [];
        document.getElementById('meta').textContent =
          `Mode: ${mode} | Status: ${status} | Progress: ${progress}%`;
        document.getElementById('bar').style.width = progress + '%';
        setLog(logs);

        if (logs.length) {
          lastLogAt = Date.now();
        }
        updateHeartbeat();
      }

      function buildParams() {
        const shared = getSharedInputs();
        const invoiceNumbers = document.getElementById('invoiceNumbers').value.trim();
        const invoiceLinks = document.getElementById('invoiceLinks').value.trim();
        const hasSb20 = document.getElementById('hasSb20').checked;
        if (!invoiceNumbers && !invoiceLinks) {
          throw new Error('Provide Invoice Number(s) and/or Invoice Link(s).');
        }

        return {
          customerNumber: shared.customerNumber,
          testMode: shared.testMode,
          invoiceNumbers,
          invoiceLinks,
          hasSb20,
        };
      }

      function buildCompileParams() {
        const shared = getSharedInputs();
        const reportType = document.getElementById('compileType').value;
        const year = Number(document.getElementById('compileYear').value);
        const targetReportId = document.getElementById('targetReportId').value;
        const months = Array.from(document.querySelectorAll('.compile-month:checked'))
          .map(cb => Number(cb.value));

        if (!reportType) throw new Error('Report Type is required.');
        if (!year || Number.isNaN(year) || year < 2000 || year > 2099) {
          throw new Error('Report Year is invalid.');
        }
        if (!targetReportId) throw new Error('Target Report File is required.');
        if (!months.length) throw new Error('Select at least one month to compile.');

        return {
          customerNumber: shared.customerNumber,
          testMode: shared.testMode,
          reportType,
          year,
          targetReportId,
          months,
        };
      }

      function loadCompileTargets() {
        if (isRunning) return;

        let shared;
        try {
          shared = getSharedInputs();
        } catch (err) {
          document.getElementById('meta').textContent = err.message;
          return;
        }

        const reportType = document.getElementById('compileType').value;
        const year = Number(document.getElementById('compileYear').value);
        if (!reportType || !year || Number.isNaN(year)) {
          document.getElementById('meta').textContent = 'Select report type and year first.';
          return;
        }

        document.getElementById('meta').textContent = 'Loading report files...';
        const select = document.getElementById('targetReportId');
        select.innerHTML = '';

        google.script.run
          .withSuccessHandler((items) => {
            const rows = items || [];
            if (!rows.length) {
              document.getElementById('meta').textContent = 'No matching report files found.';
              return;
            }

            rows.forEach((item) => {
              const opt = document.createElement('option');
              opt.value = item.id;
              opt.textContent = item.name;
              select.appendChild(opt);
            });
            document.getElementById('meta').textContent = `Loaded ${rows.length} report file(s).`;
          })
          .withFailureHandler((err) => {
            document.getElementById('meta').textContent = 'Failed to load report files';
            console.error(err);
          })
          .listCompileTargetReports({
            customerNumber: shared.customerNumber,
            testMode: shared.testMode,
            reportType,
            year,
          });
      }

      function startRun() {
        if (isRunning) return;

        const workflow = document.getElementById('workflow').value;

        let params;
        try {
          params = workflow === 'compile' ? buildCompileParams() : buildParams();
        } catch (err) {
          document.getElementById('meta').textContent = err.message;
          return;
        }

        setUiRunning(true);
        document.getElementById('meta').textContent = 'Starting...';
        document.getElementById('bar').style.width = '0%';
        document.getElementById('log').textContent = '';
        document.getElementById('heartbeat').textContent = 'Last update: starting...';
        lastLogAt = Date.now();

        const beginMethod = workflow === 'compile' ? 'beginCompileRunWithParams' : 'beginWizardRunWithParams';
        const runMethod = workflow === 'compile' ? 'runCompileMonthTotalsWithParams' : 'runWizardWithParams';

        google.script.run
          .withSuccessHandler((newRunId) => {
            runId = newRunId;

            google.script.run
              .withFailureHandler((err) => {
                console.error(err);
                pollOnce();
              })
              [runMethod](runId, params);

            pollHandle = setInterval(pollOnce, 1200);
            pollOnce();
          })
          .withFailureHandler((err) => {
            setUiRunning(false);
            document.getElementById('meta').textContent = 'Failed to start run';
            document.getElementById('log').textContent = String(err);
          })
          [beginMethod](params);
      }

      function updateHeartbeat() {
        if (!lastLogAt) {
          document.getElementById('heartbeat').textContent = 'Last update: -';
          return;
        }
        const ageSec = Math.floor((Date.now() - lastLogAt) / 1000);
        const text = ageSec <= 10
          ? `Last update: ${ageSec}s ago`
          : `Last update: ${ageSec}s ago (working...)`;
        document.getElementById('heartbeat').textContent = text;
      }

      function pollOnce() {
        if (!runId) return;
        google.script.run
          .withSuccessHandler((state) => {
            updateView(state);
            if (state.status === 'done' || state.status === 'error') {
              stopPolling();
            }
          })
          .withFailureHandler((err) => {
            console.error(err);
          })
          .getWizardRunStatus(runId);
      }

      function stopPolling() {
        if (pollHandle) clearInterval(pollHandle);
        pollHandle = null;
        setUiRunning(false);
        updateHeartbeat();
      }

      document.getElementById('compileYear').value = String(new Date().getFullYear());
      initMonthsGrid();
      document.getElementById('workflow').value = INITIAL_MODE === 'compile' ? 'compile' : 'wizard';
      onWorkflowChange();

      setInterval(updateHeartbeat, 1000);
    </script>
  </body>
</html>
